name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev \
            ccache lld llvm clang zip python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build
        run: |
          set -o pipefail
          export ARCH=arm64 SUBARCH=arm64 CCACHE_DIR=$HOME/.cache/ccache
          ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC='ccache clang' \
                CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          eval make $ARGS vendor/zangetsu_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config
          eval make $ARGS -j$(nproc) 2>&1 | tee build.log

      - name: Empacotar (AnyKernel3)
        run: |
          git clone --depth=1 -b master https://github.com/sillyaizen/AnyKernel AK3
          echo "== conteúdo de out/arch/arm64/boot =="
          ls -la out/arch/arm64/boot/
          echo "== dtbo/dtb gerados =="
          find out -name 'dtbo.img' -o -name '*.dtb' | head -30
          cp out/arch/arm64/boot/Image AK3/
          cd AK3 && zip -r9 ../Zenless-$(date +%Y%m%d).zip . -x '.git*'
          unzip -l ../Zenless-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel
          path: |
            *.zip
            build.log
